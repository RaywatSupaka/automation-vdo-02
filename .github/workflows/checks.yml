name: Foundation checks
on:
  push:
    branches: [dev]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python tools
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -c requirements.lock.txt -e ".[dev]"
      - name: Install UI tools
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium
      - name: Verify foundation
        run: .venv/Scripts/python.exe tools/check.py --scope all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-and-ui-evidence
          path: |
            build/checks/
            frontend/test-results/
