name: Foundation checks
on:
  push:
    branches: [dev]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Select affected checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if ($env:FULL_CHECK -eq 'true') {
            python tools/check.py --scope all --dry-run --plan-json build/check-plan.json
          } else {
            python tools/check.py --changed --base "$env:BASE_SHA" --dry-run --plan-json build/check-plan.json
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkPlan = Get-Content build/check-plan.json -Raw | ConvertFrom-Json
          "needs_node=$($checkPlan.needs_node.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "needs_browser=$($checkPlan.needs_browser.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "needs_extension=$($checkPlan.needs_extension.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "has_checks=$($checkPlan.has_checks.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.needs_node == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            browser_extension/package-lock.json
      - name: Install locked Python tools
        if: steps.plan.outputs.has_checks == 'true'
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -c requirements.lock.txt -e ".[dev]"
      - name: Install UI tools
        if: steps.plan.outputs.needs_node == 'true'
        working-directory: frontend
        run: npm ci
      - name: Install browser for selected checks
        if: steps.plan.outputs.needs_browser == 'true'
        working-directory: frontend
        run: npx playwright install chromium
      - name: Install Extension tools
        if: steps.plan.outputs.needs_extension == 'true'
        working-directory: browser_extension
        run: npm ci
      - name: Verify selected scopes
        if: steps.plan.outputs.has_checks == 'true'
        run: |
          $checkPlan = Get-Content build/check-plan.json -Raw | ConvertFrom-Json
          $checkScopes = @($checkPlan.scopes)
          .venv/Scripts/python.exe tools/check.py --scope $checkScopes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-and-ui-evidence
          path: |
            build/checks/
            build/check-plan.json
            frontend/test-results/
