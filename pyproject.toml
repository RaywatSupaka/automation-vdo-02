[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartflow-next"
version = "0.1.0"
description = "Observable local automation foundation for SmartFlow"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "pydantic>=2.10,<3", "filelock>=3.17,<4",
  "httpx>=0.28,<1"
]

[project.optional-dependencies]
desktop = ["pywebview>=5.4,<7", "pyinstaller>=6.12,<7"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
smartflow = "smartflow.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
smartflow = ["migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --durations=5"
markers = ["integration: API, persistence and recovery contracts", "unit: pure domain contracts"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
